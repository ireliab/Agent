[project]
name = "testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anson Lai", email = "anson.lai@onedragonpay.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.13",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "tavily>=1.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
testing = "testing:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
