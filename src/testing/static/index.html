<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Playground</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --border: #e3e3e6; --text: #1c1c1e;
    --muted: #71717a; --accent: #4f46e5;
    --tool-bg: #f4f4f5; --danger: #b91c1c; --danger-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #1f1f23; --border: #303036; --text: #ececf1;
      --muted: #9a9aa3; --accent: #818cf8;
      --tool-bg: #26262b; --danger: #f87171; --danger-bg: #2a1b1b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex;
  }
  #sidebar {
    width: 260px; flex: none; border-right: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar.collapsed { display: none; }
  .sidebar-head { padding: 12px; border-bottom: 1px solid var(--border); }
  .sidebar-head button { width: 100%; }
  #thread-list { flex: 1; overflow-y: auto; padding: 8px; }
  .thread {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text);
  }
  .thread:hover { background: var(--tool-bg); }
  .thread.active { background: var(--tool-bg); outline: 1px solid var(--accent); }
  .thread .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .when { font-size: 11px; color: var(--muted); flex: none; }
  .thread .kill {
    border: none; background: none; color: var(--muted); cursor: pointer;
    padding: 0 2px; font-size: 14px; line-height: 1; visibility: hidden;
  }
  .thread:hover .kill { visibility: visible; }
  .thread .kill:hover { color: var(--danger); }
  .sidebar-empty { color: var(--muted); font-size: 12px; padding: 12px 10px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); margin-left: auto; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: #22c55e; }
  .dot.bad { background: #ef4444; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #chat { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; flex-direction: column; gap: 8px; }
  .msg.user { align-items: flex-end; }
  .bubble {
    background: var(--accent); color: #fff; padding: 10px 14px;
    border-radius: 14px 14px 2px 14px; max-width: 80%; white-space: pre-wrap;
  }
  .body { max-width: 100%; }
  .body > *:first-child { margin-top: 0; }
  .body > *:last-child { margin-bottom: 0; }
  .body pre {
    background: var(--tool-bg); padding: 12px; border-radius: 8px;
    overflow-x: auto; font-size: 13px;
  }
  .body code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
  .body table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .body th, .body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .body a { color: var(--accent); }
  .body blockquote {
    margin: 12px 0; padding: 2px 0 2px 14px;
    border-left: 3px solid var(--border); color: var(--muted);
  }
  .think, .tool {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--tool-bg); overflow: hidden; font-size: 13px;
  }
  .think summary, .tool summary {
    cursor: pointer; padding: 8px 12px; color: var(--muted);
    list-style: none; user-select: none;
  }
  .think summary::-webkit-details-marker, .tool summary::-webkit-details-marker { display: none; }
  .think summary::before, .tool summary::before { content: "\25b8  "; }
  .think[open] summary::before, .tool[open] summary::before { content: "\25be  "; }
  .think .content, .tool .content {
    padding: 0 12px 12px; color: var(--muted); white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    max-height: 320px; overflow-y: auto;
  }
  .tool summary b { color: var(--accent); font-weight: 600; }
  .plan {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--tool-bg); padding: 10px 12px; font-size: 13px;
  }
  .plan[hidden] { display: none; }
  .plan h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .todo { display: flex; gap: 8px; padding: 2px 0; align-items: baseline; }
  .todo .mark { width: 14px; flex: none; color: var(--muted); }
  .todo.in_progress .mark, .todo.in_progress { color: var(--accent); }
  .todo.completed { color: var(--muted); text-decoration: line-through; }
  .stopped { color: var(--muted); font-size: 13px; font-style: italic; }
  .notice {
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 8px 12px; font-size: 13px;
    color: var(--muted); background: var(--tool-bg); white-space: pre-wrap;
  }
  .approval {
    border: 1px solid #d97706; border-radius: 10px; background: var(--tool-bg);
    padding: 12px; font-size: 13px;
  }
  .approval h4 { margin: 0 0 8px; font-size: 13px; color: #d97706; }
  .approval pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; margin: 6px 0; font-size: 12px; overflow-x: auto;
  }
  .approval .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .approval .approve { background: #16a34a; border-color: #16a34a; color: #fff; }
  .approval .reject { background: #dc2626; border-color: #dc2626; color: #fff; }
  .approval .respond { background: var(--panel); color: var(--text); }
  .approval.decided .actions { display: none; }
  .approval .outcome { margin-top: 8px; color: var(--muted); font-style: italic; }
  .approval .request + .request {
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border);
  }
  .approval .req-head { margin-bottom: 6px; }
  .approval .verdict { color: var(--muted); font-style: italic; }
  .approval textarea.args {
    width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; resize: vertical;
  }
  .approval textarea.args:disabled, .approval input.note:disabled {
    opacity: .65; cursor: not-allowed;
  }
  .approval input.note {
    width: 100%; margin-top: 6px; font: inherit; font-size: 12px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px;
  }
  .approval .problem { color: var(--danger); font-size: 12px; margin-top: 6px; }
  .usage { font-size: 12px; color: var(--muted); }
  .attachments { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    background: var(--tool-bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; color: var(--muted);
  }
  .chip button {
    border: none; background: none; color: var(--muted); cursor: pointer;
    padding: 0; font-size: 14px; line-height: 1;
  }
  .attach {
    height: 44px; width: 44px; padding: 0; font-size: 18px; flex: none;
  }
  .error {
    color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger);
    padding: 10px 14px; border-radius: 10px; font-size: 14px; white-space: pre-wrap;
  }
  .cursor::after { content: "\258d"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    max-height: 200px; min-height: 44px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send { background: var(--accent); color: #fff; border-color: var(--accent); height: 44px; padding: 0 18px; }
  .send.stop { background: #dc2626; border-color: #dc2626; color: #fff; }
  .hint { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
  #files {
    max-width: 760px; margin: 0 auto 10px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--tool-bg);
    padding: 10px 12px;
  }
  #files[hidden] { display: none; }
  #files h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .file-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .file-row a { color: var(--accent); text-decoration: none; }
  .file-row a:hover { text-decoration: underline; }
  .file-row .size { color: var(--muted); font-size: 12px; margin-left: auto; }
  .file-note { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-head"><button id="new-chat">+ New chat</button></div>
    <div id="thread-list"></div>
  </aside>

  <div id="main">
  <header>
    <button id="toggle-sidebar" title="Show or hide history">&#9776;</button>
    <h1>Agent Playground</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="status-text">checking...</span></span>
  </header>

  <div id="chat"><div class="inner" id="messages"></div></div>

  <footer>
    <div id="files" hidden></div>
    <div class="attachments" id="attachments"></div>
    <form id="composer">
      <input type="file" id="file-input" multiple hidden>
      <button type="button" class="attach" id="attach" title="Attach files">&#128206;</button>
      <textarea id="input" rows="1" placeholder="Ask something... (Enter to send, Shift+Enter for a newline)" autofocus></textarea>
      <button class="send" type="submit" id="send">Send</button>
    </form>
    <div class="hint" id="thread-hint"></div>
  </footer>
  </div>

<script>
const messagesEl = document.getElementById("messages");
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const composerEl = document.getElementById("composer");
const hintEl = document.getElementById("thread-hint");

let threadId = crypto.randomUUID();
let busy = false;
let controller = null;

function setSendButton(isBusy) {
  sendBtn.textContent = isBusy ? "Stop" : "Send";
  sendBtn.classList.toggle("stop", isBusy);
}

hintEl.textContent = "thread: " + threadId;

// ---------- rendering helpers ----------
function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// A small markdown renderer. Deliberately dependency-free so the page works
// offline, next to a self-hosted model. Input is HTML-escaped first, so the
// model can never inject markup.
function inlineMarkdown(text) {
  const codeSpans = [];
  let out = text.replace(/`([^`]+)`/g, (_, code) => {
    codeSpans.push("<code>" + code + "</code>");
    return "\u0001" + (codeSpans.length - 1) + "\u0001";
  });
  out = out.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (_, label, url) =>
    /^(https?:|mailto:|#|\/)/i.test(url)
      ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + "</a>"
      : label
  );
  out = out
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return out.replace(/\u0001(\d+)\u0001/g, (_, i) => codeSpans[i]);
}

function renderMarkdown(source) {
  const codeBlocks = [];
  const escaped = escapeHtml(source).replace(
    /```[^\n]*\n([\s\S]*?)(?:```|$)/g,
    (_, body) => {
      codeBlocks.push("<pre><code>" + body.replace(/\n+$/, "") + "</code></pre>");
      return "\u0000" + (codeBlocks.length - 1) + "\u0000";
    }
  );

  const lines = escaped.split("\n");
  const out = [];
  let paragraph = [];
  let quote = [];
  let listKind = null;

  const flushParagraph = () => {
    if (paragraph.length) out.push("<p>" + inlineMarkdown(paragraph.join("<br>")) + "</p>");
    paragraph = [];
  };
  const flushQuote = () => {
    if (quote.length) out.push("<blockquote>" + inlineMarkdown(quote.join("<br>")) + "</blockquote>");
    quote = [];
  };
  const flushList = () => {
    if (listKind) out.push("</" + listKind + ">");
    listKind = null;
  };
  const flushAll = () => { flushParagraph(); flushQuote(); flushList(); };

  const cellsOf = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    const next = (lines[i + 1] || "").trim();

    if (!line) { flushAll(); continue; }

    if (/^\u0000\d+\u0000$/.test(line)) { flushAll(); out.push(line); continue; }

    // table: a header row followed by a |---|---| separator
    if (line.includes("|") && next.includes("-") && /^[\s|:-]+$/.test(next)) {
      flushAll();
      const head = cellsOf(line);
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].includes("|")) rows.push(cellsOf(lines[i++]));
      i--;
      out.push(
        "<table><thead><tr>" +
          head.map((c) => "<th>" + inlineMarkdown(c) + "</th>").join("") +
          "</tr></thead><tbody>" +
          rows.map((r) => "<tr>" + r.map((c) => "<td>" + inlineMarkdown(c) + "</td>").join("") + "</tr>").join("") +
          "</tbody></table>"
      );
      continue;
    }

    const heading = /^(#{1,6})\s+(.*)$/.exec(line);
    if (heading) {
      flushAll();
      const level = heading[1].length;
      out.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
      continue;
    }

    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { flushAll(); out.push("<hr>"); continue; }

    if (/^&gt;\s?/.test(line)) {
      flushParagraph();
      flushList();
      quote.push(line.replace(/^&gt;\s?/, ""));
      continue;
    }

    const bullet = /^[-*+]\s+(.*)$/.exec(line);
    const numbered = /^\d+[.)]\s+(.*)$/.exec(line);
    if (bullet || numbered) {
      flushParagraph();
      flushQuote();
      const kind = bullet ? "ul" : "ol";
      if (listKind !== kind) { flushList(); out.push("<" + kind + ">"); listKind = kind; }
      out.push("<li>" + inlineMarkdown((bullet || numbered)[1]) + "</li>");
      continue;
    }

    flushQuote();
    flushList();
    paragraph.push(line);
  }
  flushAll();

  return out.join("\n").replace(/\u0000(\d+)\u0000/g, (_, i) => codeBlocks[i]);
}

// Qwen-style models stream their reasoning before a </think> tag. Split it off
// so the reasoning is collapsible and the answer stays clean.
function splitThinking(raw) {
  const end = raw.lastIndexOf("</think>");
  if (end !== -1) {
    return { think: raw.slice(0, end).replace(/^<think>/, ""), answer: raw.slice(end + 8) };
  }
  if (raw.startsWith("<think>")) return { think: raw.slice(7), answer: "" };
  return { think: "", answer: raw };
}

function scrollDown() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addUser(text, files) {
  const el = document.createElement("div");
  el.className = "msg user";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent =
    files && files.length ? text + "\n\n\u{1F4CE} " + files.join(", ") : text;
  el.appendChild(bubble);
  messagesEl.appendChild(el);
  scrollDown();
}

function addAssistant() {
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = [
    '<details class="think" hidden><summary>Reasoning</summary><div class="content"></div></details>',
    '<div class="plan" hidden><h3>Plan</h3><div class="todos"></div></div>',
    '<div class="tools"></div>',
    '<div class="body cursor"></div>',
  ].join("");
  messagesEl.appendChild(el);
  scrollDown();
  return {
    root: el,
    think: el.querySelector(".think"),
    thinkBody: el.querySelector(".think .content"),
    plan: el.querySelector(".plan"),
    todos: el.querySelector(".todos"),
    tools: el.querySelector(".tools"),
    body: el.querySelector(".body"),
    seenTools: new Set(),
    raw: "",
  };
}

const TODO_MARKS = { pending: "○", in_progress: "◐", completed: "✓" };

// The agent rewrites its whole todo list each time, so replace the panel
// wholesale rather than appending.
function paintPlan(turn, items) {
  turn.todos.replaceChildren();
  for (const item of items) {
    const row = document.createElement("div");
    row.className = "todo " + (item.status || "pending");
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = TODO_MARKS[item.status] || TODO_MARKS.pending;
    const text = document.createElement("span");
    text.textContent = item.content || "";
    row.append(mark, text);
    turn.todos.appendChild(row);
  }
  turn.plan.hidden = items.length === 0;
  scrollDown();
}

function paint(turn) {
  const parts = splitThinking(turn.raw);
  if (parts.think.trim()) {
    turn.think.hidden = false;
    turn.thinkBody.textContent = parts.think.trim();
  }
  turn.body.innerHTML = renderMarkdown(parts.answer);
  scrollDown();
}

function addTool(turn, event) {
  // A run that pauses for approval re-emits its tool call when it resumes,
  // so the same call would otherwise appear twice in the transcript.
  const key = event.type + ":" + (event.id || "");
  if (event.id) {
    if (turn.seenTools.has(key)) return;
    turn.seenTools.add(key);
  }
  const el = document.createElement("details");
  el.className = "tool";
  const summary = document.createElement("summary");
  const name = document.createElement("b");
  name.textContent = event.name || "tool";
  summary.append("\u{1F527} ", name, event.type === "tool_call" ? " called" : " returned");
  const content = document.createElement("div");
  content.className = "content";
  content.textContent =
    event.type === "tool_call" ? JSON.stringify(event.args, null, 2) : event.content;
  el.append(summary, content);
  turn.tools.appendChild(el);
  scrollDown();
}

function addError(turn, message) {
  const el = document.createElement("div");
  el.className = "error";
  el.textContent = message;
  turn.root.appendChild(el);
  scrollDown();
}

// ---------- conversation history ----------
function when(ts) {
  const diff = Date.now() / 1000 - ts;
  if (diff < 60) return "now";
  if (diff < 3600) return Math.floor(diff / 60) + "m";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  return Math.floor(diff / 86400) + "d";
}

async function refreshThreads() {
  const list = document.getElementById("thread-list");
  try {
    const data = await (await fetch("/api/threads")).json();
    list.replaceChildren();
    if (!data.threads.length) {
      const empty = document.createElement("div");
      empty.className = "sidebar-empty";
      empty.textContent = "No conversations yet.";
      list.appendChild(empty);
      return;
    }
    for (const t of data.threads) {
      const row = document.createElement("div");
      row.className = "thread" + (t.thread_id === threadId ? " active" : "");
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = t.title;
      label.title = t.title;
      const age = document.createElement("span");
      age.className = "when";
      age.textContent = when(t.updated_at);
      const kill = document.createElement("button");
      kill.className = "kill";
      kill.textContent = "×";
      kill.title = "Delete this conversation";
      kill.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm("Delete this conversation and its uploads?")) return;
        await fetch("/api/threads/" + encodeURIComponent(t.thread_id), { method: "DELETE" });
        if (t.thread_id === threadId) startNewChat();
        else refreshThreads();
      });
      row.addEventListener("click", () => openThread(t.thread_id));
      row.append(label, age, kill);
      list.appendChild(row);
    }
  } catch {
    /* sidebar is a convenience; never block the chat on it */
  }
}

// Rebuild a stored conversation, including an approval it is still waiting on.
async function openThread(id) {
  if (busy) return;
  const data = await (await fetch("/api/threads/" + encodeURIComponent(id))).json();
  threadId = id;
  hintEl.textContent = "thread: " + threadId;
  messagesEl.replaceChildren();
  clearAttachments();

  let turn = null;
  for (const entry of data.turns) {
    if (entry.role === "user") {
      addUser(entry.text);
      turn = null;
    } else {
      turn = addAssistant();
      turn.body.classList.remove("cursor");
      for (const event of entry.events || []) addTool(turn, event);
      turn.raw = entry.text || "";
      paint(turn);
    }
  }
  if (data.todos && data.todos.length && turn) paintPlan(turn, data.todos);
  if (data.pending && data.pending.length) {
    if (!turn) turn = addAssistant();
    turn.body.classList.remove("cursor");
    addApproval(turn, data.pending);
  }
  refreshThreads();
  refreshFiles();
  scrollDown();
}

function startNewChat() {
  threadId = crypto.randomUUID();
  messagesEl.replaceChildren();
  hintEl.textContent = "thread: " + threadId;
  clearAttachments();
  inputEl.focus();
  refreshFiles();
  refreshThreads();
}

// ---------- attachments ----------
const attachments = [];

function paintAttachments() {
  const bar = document.getElementById("attachments");
  bar.replaceChildren();
  for (const name of attachments) {
    const chip = document.createElement("span");
    chip.className = "chip";
    const label = document.createElement("span");
    label.textContent = "\u{1F4CE} " + name;
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.title = "Remove";
    remove.addEventListener("click", () => {
      attachments.splice(attachments.indexOf(name), 1);
      paintAttachments();
    });
    chip.append(label, remove);
    bar.appendChild(chip);
  }
}

function clearAttachments() {
  attachments.length = 0;
  paintAttachments();
}

async function uploadFiles(fileList) {
  for (const file of fileList) {
    const form = new FormData();
    form.append("file", file);
    // Uploads belong to one conversation, so a new chat cannot read them.
    form.append("thread_id", threadId);
    try {
      const res = await fetch("/api/upload", { method: "POST", body: form });
      if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()));
      const info = await res.json();
      if (!attachments.includes(info.name)) attachments.push(info.name);
    } catch (err) {
      alert("Upload failed for " + file.name + ": " + err);
    }
  }
  paintAttachments();
}

// ---------- files ----------
function fileRow(label, href, size) {
  const row = document.createElement("div");
  row.className = "file-row";
  const link = document.createElement("a");
  link.href = href;
  link.textContent = label;
  link.setAttribute("download", "");
  const bytes = document.createElement("span");
  bytes.className = "size";
  bytes.textContent = size < 1024 ? size + " B" : Math.round(size / 1024) + " KB";
  row.append(link, bytes);
  return row;
}

async function refreshFiles() {
  const panel = document.getElementById("files");
  try {
    const res = await fetch("/api/files?thread_id=" + encodeURIComponent(threadId));
    const data = await res.json();
    panel.replaceChildren();

    if (data.outputs.length) {
      const heading = document.createElement("h2");
      heading.textContent = "Files";
      panel.appendChild(heading);
      for (const f of data.outputs) {
        panel.appendChild(
          fileRow(f.name, "/api/files/output?name=" + encodeURIComponent(f.name), f.size)
        );
      }
    }

    if (data.workspace.length) {
      const note = document.createElement("div");
      note.className = "file-note";
      note.textContent = "Agent scratch workspace (in memory, lost on restart):";
      panel.appendChild(note);
      for (const f of data.workspace) {
        const href =
          "/api/files/workspace?thread_id=" + encodeURIComponent(threadId) +
          "&path=" + encodeURIComponent(f.path);
        panel.appendChild(fileRow(f.path, href, f.size));
      }
    }

    panel.hidden = !data.outputs.length && !data.workspace.length;
  } catch {
    panel.hidden = true;
  }
}

// ---------- approvals ----------
// One card per pending tool call. Each call gets its own decision, because the
// agent can ask for several at once and you may want to allow one and refuse
// another. langchain requires exactly one decision per request, in order, so
// nothing is sent until every call has been decided.
function addApproval(turn, requests) {
  const card = document.createElement("div");
  card.className = "approval";

  const title = document.createElement("h4");
  title.textContent =
    requests.length > 1
      ? "The agent wants to run " + requests.length + " tools. Decide on each:"
      : "The agent wants to run a tool. Approve?";
  card.appendChild(title);

  const decisions = new Array(requests.length).fill(null);

  const submitIfComplete = () => {
    if (decisions.some((d) => d === null)) return;
    card.classList.add("decided");
    const summary = document.createElement("div");
    summary.className = "outcome";
    summary.textContent = decisions
      .map((d, i) => (requests[i].name || "tool") + ": " + d.type)
      .join(" · ");
    card.appendChild(summary);
    resumeRun(turn, decisions);
  };

  requests.forEach((req, index) => {
    const row = document.createElement("div");
    row.className = "request";

    const head = document.createElement("div");
    head.className = "req-head";
    const name = document.createElement("b");
    name.textContent = req.name || "tool";
    const verdict = document.createElement("span");
    verdict.className = "verdict";
    head.append(name, verdict);

    const original = JSON.stringify(req.args || {}, null, 2);
    const args = document.createElement("textarea");
    args.className = "args";
    args.value = original;
    args.spellcheck = false;
    args.rows = Math.min(original.split("\n").length + 1, 14);

    const note = document.createElement("input");
    note.className = "note";
    note.type = "text";
    note.placeholder = "Reason for rejecting, or the answer to give instead";

    const problem = document.createElement("div");
    problem.className = "problem";
    problem.hidden = true;

    const actions = document.createElement("div");
    actions.className = "actions";
    const approve = document.createElement("button");
    approve.className = "approve";
    approve.textContent = "Approve";
    const reject = document.createElement("button");
    reject.className = "reject";
    reject.textContent = "Reject";
    const respond = document.createElement("button");
    respond.className = "respond";
    respond.textContent = "Answer instead";
    respond.title = "Skip the tool and give the agent this answer as its result";
    actions.append(approve, reject, respond);

    // Editing the arguments turns Approve into an edit decision — same tool,
    // your arguments.
    const edited = () => args.value.trim() !== original.trim();
    args.addEventListener("input", () => {
      approve.textContent = edited() ? "Run with edits" : "Approve";
    });

    const settle = (decision, label) => {
      decisions[index] = decision;
      verdict.textContent = " — " + label;
      args.disabled = true;
      note.disabled = true;
      actions.remove();
      problem.hidden = true;
      submitIfComplete();
    };

    const fail = (message) => {
      problem.textContent = message;
      problem.hidden = false;
    };

    approve.addEventListener("click", () => {
      if (!edited()) return settle({ type: "approve" }, "approved");
      let parsed;
      try {
        parsed = JSON.parse(args.value);
      } catch (err) {
        return fail("Arguments are not valid JSON: " + err.message);
      }
      if (parsed === null || typeof parsed !== "object" || Array.isArray(parsed)) {
        return fail("Arguments must be a JSON object.");
      }
      settle(
        { type: "edit", edited_action: { name: req.name, args: parsed } },
        "edited and approved"
      );
    });

    reject.addEventListener("click", () => {
      const reason = note.value.trim();
      const decision = { type: "reject" };
      if (reason) decision.message = reason;
      settle(decision, reason ? "rejected: " + reason : "rejected");
    });

    respond.addEventListener("click", () => {
      const reply = note.value.trim();
      if (!reply) {
        return fail("Type the answer to give the agent, then press Answer instead.");
      }
      settle({ type: "respond", message: reply }, "answered instead");
    });

    row.append(head, args, note, problem, actions);
    card.appendChild(row);
  });

  turn.root.appendChild(card);
  scrollDown();
}

function showUsage(turn, event) {
  turn.usageIn = (turn.usageIn || 0) + (event.input || 0);
  turn.usageOut = (turn.usageOut || 0) + (event.output || 0);
  if (!turn.usageEl) {
    turn.usageEl = document.createElement("div");
    turn.usageEl.className = "usage";
    turn.root.appendChild(turn.usageEl);
  }
  turn.usageEl.textContent =
    turn.usageIn.toLocaleString() + " in / " + turn.usageOut.toLocaleString() + " out tokens";
}

// ---------- streaming ----------
function handleEvent(turn, event) {
  if (event.type === "token") {
    turn.raw += event.text;
    paint(turn);
  } else if (event.type === "notice") {
    // Something the agent's machinery said rather than the model, e.g. a run
    // stopped because it hit the model-call limit.
    const note = document.createElement("div");
    note.className = "notice";
    note.textContent = event.text;
    turn.root.appendChild(note);
    scrollDown();
  } else if (event.type === "interrupt") {
    addApproval(turn, event.requests || []);
  } else if (event.type === "usage") {
    showUsage(turn, event);
  } else if (event.type === "todos") {
    paintPlan(turn, event.items || []);
  } else if (event.type === "tool_call" || event.type === "tool_result") {
    addTool(turn, event);
  } else if (event.type === "error") {
    addError(turn, event.message);
  }
}

async function consume(url, body, turn) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    signal: controller.signal,
  });
  if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()));

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const chunks = buffer.split("\n\n");
    buffer = chunks.pop();
    for (const chunk of chunks) {
      const line = chunk.split("\n").find((l) => l.startsWith("data: "));
      if (!line) continue;
      handleEvent(turn, JSON.parse(line.slice(6)));
    }
  }
}

async function runTurn(url, body, turn) {
  busy = true;
  setSendButton(true);
  controller = new AbortController();
  turn.body.classList.add("cursor");
  try {
    await consume(url, body, turn);
  } catch (err) {
    // An abort is the user pressing Stop, not a failure.
    if (err && err.name === "AbortError") {
      const note = document.createElement("div");
      note.className = "stopped";
      note.textContent = "Stopped.";
      turn.root.appendChild(note);
    } else {
      addError(turn, String(err));
    }
  } finally {
    turn.body.classList.remove("cursor");
    busy = false;
    controller = null;
    setSendButton(false);
    inputEl.focus();
    refreshFiles();
    refreshThreads();
  }
}

async function send(text) {
  addUser(text, attachments);
  const turn = addAssistant();
  const body = { message: text, thread_id: threadId, attachments: attachments.slice() };
  clearAttachments();
  await runTurn("/api/chat", body, turn);
}

// Continues the same assistant turn once the user approves or rejects.
async function resumeRun(turn, decisions) {
  await runTurn("/api/resume", { thread_id: threadId, decisions: decisions }, turn);
}

// ---------- events ----------
composerEl.addEventListener("submit", (e) => {
  e.preventDefault();
  // While a run is in flight the button is a Stop button. Tell the server
  // first — dropping the connection on its own does not stop the model.
  if (busy) {
    fetch("/api/cancel", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: threadId }),
    }).catch(() => {});
    if (controller) controller.abort();
    return;
  }
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  send(text);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    // Enter must not double as Stop - only the button does that.
    if (!busy) composerEl.requestSubmit();
  }
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
});

const fileInput = document.getElementById("file-input");
document.getElementById("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  await uploadFiles(fileInput.files);
  fileInput.value = "";
});

document.getElementById("new-chat").addEventListener("click", startNewChat);

document.getElementById("toggle-sidebar").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("collapsed");
});

refreshFiles();
refreshThreads();

fetch("/api/health")
  .then((r) => r.json())
  .then((health) => {
    document.getElementById("dot").className = "dot ok";
    document.getElementById("status-text").textContent = health.model || "connected";
  })
  .catch(() => {
    document.getElementById("dot").className = "dot bad";
    document.getElementById("status-text").textContent = "server unreachable";
  });
</script>
</body>
